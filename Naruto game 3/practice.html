
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naruto Hand-Sign Game</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shojumaru&family=Yuji+Boku&family=Reggae+One&family=Shippori+Mincho:wght@600;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    .back-btn {
      position: fixed;
      z-index: 50;
      top: 16px;
      right: 16px;
      padding: 9px 14px;
      color: white;
      background: rgba(0, 18, 28, 0.86);
      border: 1px solid rgba(101, 247, 255, 0.75);
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
      transition: background-color 150ms ease, box-shadow 150ms ease;
    }

    .back-btn:hover,
    .back-btn:focus-visible {
      background: rgba(0, 75, 95, 0.95);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.45);
      outline: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #shinobiFrame {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .frame-corner-bg {
      position: absolute;
      width: 32px;
      height: 32px;
      background: #090909;
      z-index: 1;
    }

    .frame-corner-bg--tl { top: 0; left: 0; }
    .frame-corner-bg--tr { top: 0; right: 0; }
    .frame-corner-bg--bl { bottom: 0; left: 0; }
    .frame-corner-bg--br { bottom: 0; right: 0; }

    .frame-edge {
      position: absolute;
      z-index: 2;
      background-color: #090909;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .frame-edge--horizontal {
      left: 0;
      width: 100%;
      height: 32px;
    }

    .frame-edge--vertical {
      top: 0;
      height: 100%;
      width: 32px;
    }

    .frame-edge--top {
      top: 0;
      background-image: linear-gradient(
        to bottom,
        #c99d32 0 1px,
        #090909 1px 13px,
        #e2b83f 13px 19px,
        #090909 19px 31px,
        #c99d32 31px 32px
      );
      clip-path: polygon(0 0, 100% 0, calc(100% - 32px) 100%, 32px 100%);
    }

    .frame-edge--bottom {
      bottom: 0;
      background-image: linear-gradient(
        to top,
        #c99d32 0 1px,
        #090909 1px 13px,
        #e2b83f 13px 19px,
        #090909 19px 31px,
        #c99d32 31px 32px
      );
      clip-path: polygon(32px 0, calc(100% - 32px) 0, 100% 100%, 0 100%);
    }

    .frame-edge--left {
      left: 0;
      background-image: linear-gradient(
        to right,
        #c99d32 0 1px,
        #090909 1px 13px,
        #e2b83f 13px 19px,
        #090909 19px 31px,
        #c99d32 31px 32px
      );
      clip-path: polygon(0 0, 100% 32px, 100% calc(100% - 32px), 0 100%);
    }

    .frame-edge--right {
      right: 0;
      background-image: linear-gradient(
        to left,
        #c99d32 0 1px,
        #090909 1px 13px,
        #e2b83f 13px 19px,
        #090909 19px 31px,
        #c99d32 31px 32px
      );
      clip-path: polygon(0 32px, 100% 0, 100% 100%, 0 calc(100% - 32px));
    }

    .frame-title {
      position: absolute;
      top: 1px;
      left: 50%;
      z-index: 4;
      padding: 6px 28px 8px;
      border: 1px solid #d5ad3c;
      border-top: 0;
      color: #f6e5b2;
      background: #090909;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.8), 0 0 12px rgba(226, 184, 63, 0.35);
      font-family: "Shojumaru", "Yuji Boku", "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", "MS PMincho", Georgia, serif;
      font-size: clamp(18px, 2.2vw, 26px);
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1.2;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(226, 184, 63, 0.6), 0 2px 4px rgba(0, 0, 0, 0.9);
      transform: translateX(-50%);
      white-space: nowrap;
    }

    #v_src, #out {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #out {
      z-index: 2;
      pointer-events: none;
    }

    .darkness {
      position: absolute;
      inset: 0;
      background: rgba(10, 5, 0, 0.22);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 5;
    }

    #facePointer {
      position: absolute;
      z-index: 40;
      width: 20px;
      height: 20px;
      border: 3px solid #ff1744;
      border-radius: 50%;
      background: rgba(255, 23, 68, 0.35);
      box-shadow: 0 0 14px 4px #ff1744;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }

    .fx {
      position: absolute;
      width: min(42vw, 520px);
      height: auto;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      mix-blend-mode: screen;
      z-index: 20;
      object-fit: contain;
    }


    #rasenFx {
      width: min(175.5vw, 2160px);
    }

        #status {
      position: absolute;
      z-index: 30;
      left: 16px;
      top: 16px;
      width: min(255px, calc(100vw - 28px));
      color: white;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(101, 247, 255, 0.35);
      padding: 12px 14px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 13.5px;
      line-height: 1.45;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
      user-select: none;
    }

    #status > strong {
      display: block;
      color: #65f7ff; /* Cyan blue heading */
      font-family: Arial, sans-serif;
      font-size: 13.5px;
      font-weight: bold;
      letter-spacing: 0.8px;
      margin-bottom: 5px;
      text-shadow: 0 0 8px rgba(101, 247, 255, 0.45);
    }

    #message {
      color: #ffff00; /* Yellow color for current status of hands */
      font-family: Arial, sans-serif;
      font-size: 14.5px;
      font-weight: bold;
      margin: 6px 0 8px;
      line-height: 1.35;
      text-shadow: 0 0 6px rgba(255, 255, 0, 0.35);
      word-break: break-word;
    }

    #help {
      color: #ddd;
      font-family: Arial, sans-serif;
      font-size: 11.5px;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 3.5px;
    }

    .jutsu-line {
      line-height: 1.35;
      color: #e2e8f0;
    }

    /* 4 Different Colors for the Four Jutsus */
    .j-rasen strong {
      color: #38bdf8; /* Rasenshuriken: Cyan / Wind Blue */
      text-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
    }
    .j-chidori strong {
      color: #a78bfa; /* Chidori: Lightning Violet */
      text-shadow: 0 0 6px rgba(167, 139, 250, 0.4);
    }
    .j-fireball strong {
      color: #ff7a1a; /* Fireball Jutsu: Flame Orange */
      text-shadow: 0 0 6px rgba(255, 122, 26, 0.4);
    }
    .j-purple strong {
      color: #e879f9; /* Hollow Purple: Mystic Purple */
      text-shadow: 0 0 6px rgba(232, 121, 249, 0.4);
    }

    .help-note {
      color: #94a3b8;
      font-size: 10px;
      margin-top: 4px;
      font-style: italic;
    }

    #enableMp4Audio {
      margin-top: 8px;
      padding: 6px 10px;
      color: #111;
      background: #ffff00;
      border: 0;
      border-radius: 5px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      font-size: 11.5px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }
    #enableMp4Audio:hover {
      background: #fff066;
    }
    #enableMp4Audio:disabled {
      background: #555;
      color: #aaa;
      cursor: default;
    }

    @media (max-width: 600px) {
      #status {
        left: 8px;
        top: 8px;
        width: min(230px, calc(100vw - 16px));
        padding: 9px 11px;
      }
      #status > strong {
        font-size: 12px;
      }
      #message {
        font-size: 13.5px;
      }
      #help {
        font-size: 10.5px;
      }
    }

  </style>
</head>

<body>
  <div id="shinobiFrame" aria-hidden="true">
    <span class="frame-corner-bg frame-corner-bg--tl"></span>
    <span class="frame-corner-bg frame-corner-bg--tr"></span>
    <span class="frame-corner-bg frame-corner-bg--bl"></span>
    <span class="frame-corner-bg frame-corner-bg--br"></span>
    <span class="frame-edge frame-edge--horizontal frame-edge--top"></span>
    <span class="frame-edge frame-edge--horizontal frame-edge--bottom"></span>
    <span class="frame-edge frame-edge--vertical frame-edge--left"></span>
    <span class="frame-edge frame-edge--vertical frame-edge--right"></span>
    <span class="frame-title">Training Ground</span>
  </div>
  <a href="index.html" class="back-btn">← Main menu</a>
  <video id="v_src" autoplay playsinline muted></video>
  <canvas id="out"></canvas>
  <div class="darkness"></div>
  <div id="facePointer" aria-hidden="true"></div>

  <video id="rasenFx" class="fx"
    src="assets/naruto.mp4" muted playsinline></video>

  <video id="chidoriFx" class="fx"
    src="assets/sasuke.mp4" muted playsinline></video>

  <video id="fireballFx" class="fx"
    src="assets/fireball_justsu.mp4" muted playsinline></video>

  <video id="hollowPurpleFx" class="fx"
    src="assets/Hollow%20purple.mp4" muted playsinline></video>

  <div id="status">
    <strong>NARUTO HAND-SIGN GAME</strong>
    <div id="message">Show one hand to the camera.</div>
    <div id="help">
      <div class="jutsu-line j-rasen"><strong>Rasenshuriken:</strong> ✌🏼 Peace → ✊🏼 Fist → ✋🏼 Open</div>
      <div class="jutsu-line j-chidori"><strong>Chidori:</strong> ✊🏼 Fist → ☝🏼 Dog → ✋🏼 Open</div>
      <div class="jutsu-line j-fireball"><strong>Fireball Jutsu:</strong> 👌🏼 Horse → 👉🏼 Rat → 🤙🏼 Tiger</div>
      <div class="jutsu-line j-purple"><strong>Hollow Purple:</strong> 🤘🏼 Horns → ✊🏼 Fist → ✌🏼 Peace</div>
      <div class="help-note">Some signs are single-hand approximations.</div>
    </div>
    <button id="enableMp4Audio" type="button">Enable MP4 audio</button>
  </div>

<script>
const video = document.getElementById("v_src");
const canvas = document.getElementById("out");
const ctx = canvas.getContext("2d");

const rasenFx = document.getElementById("rasenFx");
const chidoriFx = document.getElementById("chidoriFx");
const fireballFx = document.getElementById("fireballFx");
const hollowPurpleFx = document.getElementById("hollowPurpleFx");
const message = document.getElementById("message");
const facePointer = document.getElementById("facePointer");
const enableMp4AudioButton = document.getElementById("enableMp4Audio");

let mp4AudioEnabled = false;

const attackEffects = {
  Rasenshuriken: rasenFx,
  Chidori: chidoriFx,
  "Fireball Jutsu": fireballFx,
  "Hollow Purple": hollowPurpleFx
};

enableMp4AudioButton.addEventListener("click", () => {
  Object.values(attackEffects).forEach(fx => {
    fx.muted = false;
  });
  mp4AudioEnabled = true;
  enableMp4AudioButton.textContent = "MP4 audio enabled";
  enableMp4AudioButton.disabled = true;
  message.textContent = "MP4 audio enabled. Perform an attack sequence.";
});

const HOLD_MS = 300;
const SEQUENCE_TIMEOUT_MS = 3500;

const states = {
  Left: createState(),
  Right: createState()
};

Object.entries(attackEffects).forEach(([attackName, fx]) => {
  fx.addEventListener("ended", () => {
    for (const state of Object.values(states)) {
      if (state.attack === attackName) {
        state.attack = null;
      }
    }
    fx.style.display = "none";
  });
});

function createState() {
  return {
    next: 0,
    type: null,
    lastSign: null,
    signSince: 0,
    lastAcceptedSign: null,
    lastAcceptedAt: 0,
    lastSeen: 0,
    attack: null
  };
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function extendedFingers(p) {
  const wrist = p[0];

  return [
    distance(p[8], wrist) > distance(p[6], wrist) * 1.12,
    distance(p[12], wrist) > distance(p[10], wrist) * 1.12,
    distance(p[16], wrist) > distance(p[14], wrist) * 1.12,
    distance(p[20], wrist) > distance(p[18], wrist) * 1.12
  ];
}

function thumbExtended(p) {
  return distance(p[4], p[5]) >
         distance(p[3], p[5]) * 1.08;
}

function classifyGesture(p) {
  const f = extendedFingers(p);
  const thumb = thumbExtended(p);
  const count = f.filter(Boolean).length;

  // Open palm.
  if (count === 4 && thumb) return "open";

  // Fist.
  if (count === 0 && !thumb) return "fist";

  // Hollow Purple lead-in: index and pinky extended.
  if (f[0] && !f[1] && !f[2] && f[3]) {
    return "purpleStart";
  }

  // Horse: middle, ring and pinky fingers extended.
  if (!f[0] && f[1] && f[2] && f[3]) {
    return "horse";
  }

  // Rat: index finger and thumb extended.
  if (f[0] && !f[1] && !f[2] && !f[3] && thumb) {
    return "rat";
  }

  // Tiger: only pinky extended.
  if (!f[0] && !f[1] && !f[2] && f[3]) {
    return "tiger";
  }

  // Peace: index and middle fingers extended.
  if (f[0] && f[1] && !f[2] && !f[3]) {
    return "peace";
  }

  // Dog: index finger extended.
  if (f[0] && !f[1] && !f[2] && !f[3] && !thumb) {
    return "dog";
  }

  return "other";
}

function resetSequence(state) {
  state.next = 0;
  state.type = null;
  state.lastAcceptedSign = null;
  state.lastAcceptedAt = 0;
}

function hideEffects() {
  Object.values(attackEffects).forEach(fx => {
    fx.style.display = "none";
  });
}

function cameraPointToViewport(x, y) {
  const scale = Math.max(
    window.innerWidth / video.videoWidth,
    window.innerHeight / video.videoHeight
  );

  const renderedWidth = video.videoWidth * scale;
  const renderedHeight = video.videoHeight * scale;
  const cropX = (renderedWidth - window.innerWidth) / 2;
  const cropY = (renderedHeight - window.innerHeight) / 2;

  return {
    x: window.innerWidth - (x * renderedWidth - cropX),
    y: y * renderedHeight - cropY
  };
}

function positionEffect(fx, p) {
  if (fx === chidoriFx) {
    const xs = p.map(point => point.x);
    const ys = p.map(point => point.y);

    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);

    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;

    const aspectRatio = fx.videoWidth && fx.videoHeight
      ? fx.videoWidth / fx.videoHeight
      : 16 / 9;

    const handWidth = (maxX - minX) * window.innerWidth;
    const handHeight = (maxY - minY) * window.innerHeight;

    fx.style.width =
      `${Math.max(handWidth, handHeight * aspectRatio) * 8}px`;

    fx.style.left = `${(1 - centerX) * window.innerWidth}px`;
    fx.style.top = `${centerY * window.innerHeight}px`;
    return;
  }

  const wrist = p[0];
  const middleMcp = p[9];
  const middleTip = p[12];

  const palmX = (wrist.x + middleMcp.x) / 2;
  const palmY = (wrist.y + middleMcp.y) / 2;

  if (fx === fireballFx) {
    const xs = p.map(point => point.x);
    const ys = p.map(point => point.y);
    const handWidth = (Math.max(...xs) - Math.min(...xs)) * window.innerWidth;
    const handHeight = (Math.max(...ys) - Math.min(...ys)) * window.innerHeight;
    const fingertipX = (p[8].x + p[12].x + p[16].x + p[20].x) / 4;
    const fingertipY = (p[8].y + p[12].y + p[16].y + p[20].y) / 4;
    const aspectRatio = fx.videoWidth && fx.videoHeight
      ? fx.videoWidth / fx.videoHeight
      : 16 / 9;

    fx.style.width =
      `${Math.max(handWidth, handHeight * aspectRatio) * 2}px`;
    fx.style.left = `${(1 - fingertipX) * window.innerWidth}px`;
    fx.style.top = `${fingertipY * window.innerHeight}px`;
    return;
  }

  if (fx === hollowPurpleFx) {
    const xs = p.map(point => point.x);
    const ys = p.map(point => point.y);
    const handWidth = (Math.max(...xs) - Math.min(...xs)) * window.innerWidth;
    const handHeight = (Math.max(...ys) - Math.min(...ys)) * window.innerHeight;
    const aspectRatio = fx.videoWidth && fx.videoHeight
      ? fx.videoWidth / fx.videoHeight
      : 16 / 9;
    const effectWidth = Math.max(handWidth, handHeight * aspectRatio) * 0.36;
    const indexTip = p[8];
    const indexMcp = p[5];
    const directionX = (indexMcp.x - indexTip.x) * window.innerWidth;
    const directionY = (indexTip.y - indexMcp.y) * window.innerHeight;
    const directionLength = Math.hypot(directionX, directionY) || 1;
    const offset = effectWidth * 0.4;
    const centerX = (1 - indexTip.x) * window.innerWidth +
      (directionX / directionLength) * offset;
    const centerY = indexTip.y * window.innerHeight +
      (directionY / directionLength) * offset;

    fx.style.width = `${effectWidth}px`;
    fx.style.left = `${centerX}px`;
    fx.style.top = `${centerY}px`;
    return;
  }

  const fingerOffset = fx === rasenFx ? 1.15 : 0.12;
  const offsetX = (middleTip.x - middleMcp.x) * fingerOffset;
  const offsetY = (middleTip.y - middleMcp.y) * fingerOffset;

  const x = (1 - (palmX + offsetX)) * window.innerWidth;
  const y = (palmY + offsetY) * window.innerHeight;

  fx.style.left = `${x}px`;
  fx.style.top = `${y}px`;
}

function startAttack(state, name, p, handLabel) {
  state.attack = name;
  resetSequence(state);

  const fx = attackEffects[name];

  Object.values(attackEffects)
    .filter(effect => effect !== fx)
    .forEach(effect => {
      effect.style.display = "none";
    });

  fx.currentTime = 0;
  fx.style.display = "block";
  fx.style.opacity = "1";

  positionEffect(fx, p);

  fx.play().catch(error => {
    state.attack = null;
    fx.style.display = "none";
    message.textContent = mp4AudioEnabled
      ? `Could not play ${name} animation. Check its video file.`
      : `Could not play ${name}. Click Enable MP4 audio, then retry.`;
    console.error(`Could not play ${name} animation:`, error);
  });

  message.textContent =
    `${name} activated using ${handLabel.toLowerCase()} hand!`;
}

function processGesture(state, sign, p, handLabel, now) {
  // Keep an active attack attached to its hand.
  if (state.attack) {
    const fx = attackEffects[state.attack];

    if (!fx) return;

    positionEffect(fx, p);
    fx.style.display = "block";
    return;
  }

  // Reset an incomplete sequence after a timeout.
  if (
    state.next > 0 &&
    now - state.lastAcceptedAt > SEQUENCE_TIMEOUT_MS
  ) {
    resetSequence(state);
    message.textContent = "Sequence timed out. Try again.";
  }

  // Track how long the current sign has been held.
  if (sign !== state.lastSign) {
    state.lastSign = sign;
    state.signSince = now;
  }

  if (sign === "other" || now - state.signSince < HOLD_MS) {
    return;
  }

  // Do not count the same sign repeatedly while held.
  if (sign === state.lastAcceptedSign) {
    return;
  }

  let expected = null;

  if (state.next === 0) {
    if (sign === "peace") {
      state.type = "Rasenshuriken";
      expected = "peace";
    } else if (sign === "fist") {
      state.type = "Chidori";
      expected = "fist";
    } else if (sign === "horse") {
      state.type = "Fireball Jutsu";
      expected = "horse";
    } else if (sign === "purpleStart") {
      state.type = "Hollow Purple";
      expected = "purpleStart";
    }
  } else if (state.next === 1) {
    if (state.type === "Rasenshuriken" && sign === "fist") {
      expected = "fist";
    } else if (state.type === "Chidori" && sign === "dog") {
      expected = "dog";
    } else if (state.type === "Fireball Jutsu" && sign === "rat") {
      expected = "rat";
    } else if (state.type === "Hollow Purple" && sign === "fist") {
      expected = "fist";
    }
  } else if (state.next === 2) {
    if (state.type === "Fireball Jutsu" && sign === "tiger") {
      expected = "tiger";
    } else if (
      (state.type === "Rasenshuriken" || state.type === "Chidori") &&
      sign === "open"
    ) {
      expected = "open";
    } else if (state.type === "Hollow Purple" && sign === "peace") {
      expected = "peace";
    }
  }

  // If a wrong sign is shown, allow restarting with a first sign.
  if (!expected) {
    if (
      sign === "peace" ||
      sign === "fist" ||
      sign === "horse" ||
      sign === "purpleStart"
    ) {
      state.next = 0;

      state.type = sign === "peace"
        ? "Rasenshuriken"
        : sign === "fist"
          ? "Chidori"
          : sign === "horse"
            ? "Fireball Jutsu"
            : "Hollow Purple";

      state.next = 1;
      state.lastAcceptedSign = sign;
      state.lastAcceptedAt = now;

      message.textContent = `${state.type}: first sign detected.`;
    }

    return;
  }

  state.lastAcceptedSign = sign;
  state.lastAcceptedAt = now;

  if (state.next === 0) {
    state.next = 1;
    message.textContent = `${state.type}: first sign detected.`;
  } else if (state.next === 1) {
    state.next = 2;

    const finalSign = state.type === "Fireball Jutsu"
      ? "Tiger"
      : state.type === "Hollow Purple"
        ? "Purple sign (index + middle)"
        : "open palm";

    message.textContent =
      `${state.type}: final sign — ${finalSign}!`;
  } else if (state.next === 2) {
    startAttack(state, state.type, p, handLabel);
  }
}

function onResults(results) {
  if (!video.videoWidth || !video.videoHeight) return;

  if (
    canvas.width !== video.videoWidth ||
    canvas.height !== video.videoHeight
  ) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const now = performance.now();
  const seen = new Set();

  if (results.multiHandLandmarks && results.multiHandedness) {
    results.multiHandLandmarks.forEach((p, i) => {
      const label = results.multiHandedness[i].label;
      const state = states[label] || states.Right;

      seen.add(label);
      state.lastSeen = now;

      ctx.save();
      ctx.shadowBlur = 9;
      ctx.shadowColor = "#00fbff";

      drawConnectors(ctx, p, HAND_CONNECTIONS, {
        color: "#00d4ff",
        lineWidth: 3
      });

      drawLandmarks(ctx, p, {
        color: "#ffffff",
        lineWidth: 1,
        radius: 2
      });

      ctx.restore();

      const sign = classifyGesture(p);
      processGesture(state, sign, p, label, now);
    });
  }

  // Reset incomplete sequences if a hand disappears.
  for (const label of ["Left", "Right"]) {
    const state = states[label];

    if (!seen.has(label) && now - state.lastSeen > 500) {
      state.lastSign = null;
      state.signSince = 0;
      state.lastAcceptedSign = null;

      if (!state.attack) {
        resetSequence(state);
      }
    }
  }

  const active = ["Left", "Right"].some(label => {
    return Boolean(states[label].attack);
  });

  if (!active) {
    hideEffects();

    if (message.textContent.includes("activated")) {
      message.textContent = "Show a hand and perform a sequence.";
    }
  }
}

function onFaceResults(results) {
  const detection = results.detections && results.detections[0];
  const location = detection && detection.locationData;
  const box = location && location.relativeBoundingBox;

  if (!box) {
    facePointer.style.display = "none";
    return;
  }

  const boxCenterX = box.xCenter ?? box.xMin + box.width / 2;
  const boxCenterY = box.yCenter ?? box.yMin + box.height / 2;
  const mouth =
    location.relativeKeypoints && location.relativeKeypoints[3];

  const mouthPoint = mouth
    ? cameraPointToViewport(mouth.x, mouth.y)
    : cameraPointToViewport(
        boxCenterX,
        boxCenterY + box.height * 0.22
      );

  if (
    !Number.isFinite(mouthPoint.x) ||
    !Number.isFinite(mouthPoint.y)
  ) {
    facePointer.style.display = "none";
    return;
  }

  facePointer.style.left = `${mouthPoint.x}px`;
  facePointer.style.top = `${mouthPoint.y}px`;
  facePointer.style.display = "block";
}

const hands = new Hands({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.65,
  minTrackingConfidence: 0.65
});

hands.onResults(onResults);

const faceDetection = new FaceDetection({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
});

faceDetection.setOptions({
  model: "short",
  minDetectionConfidence: 0.5
});

faceDetection.onResults(onFaceResults);

let lastFaceDetectionAt = 0;
let faceDetectionFailed = false;

const camera = new Camera(video, {
  onFrame: async () => {
    await hands.send({ image: video });

    const now = performance.now();

    if (
      !faceDetectionFailed &&
      now - lastFaceDetectionAt >= 250
    ) {
      lastFaceDetectionAt = now;

      try {
        await faceDetection.send({ image: video });
      } catch (error) {
        faceDetectionFailed = true;
        facePointer.style.display = "none";

        console.error(
          "Face detection failed; hand tracking will continue:",
          error
        );
      }
    }
  },
  width: 1280,
  height: 720
});

camera.start().catch(error => {
  message.textContent = "Could not start camera. Check permissions.";
  console.error(error);
});

</script>

</body>
</html>
